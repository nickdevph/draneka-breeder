function splashScreen(){return `<main class="splash"><div class="splash-card"><img class="splash-logo" src="${LOGO}" alt="Draneka"><div class="eyebrow">Aquarium Breeder</div><h1>Every generation.<br>A better story.</h1><p class="tagline">Parentage, reproductive output and growing offspring.<br>Connected without forcing every breeder into the same path.</p><div class="splash-visual"><div class="splash-node">${ico('lineage')}<span>Parentage</span></div>${ico('chevron')}<div class="splash-node">${ico('egg')}<span>Output</span></div>${ico('chevron')}<div class="splash-node">${ico('cohort')}<span>Offspring</span></div></div>${action('begin()','Open demo fishroom','primary full','move')}${action("go('onboarding')",'Set up Breeder','ghost full mt8')}<small>Interactive prototype v0.6 · species-aware breeder programs · sample records only<br>Canonical v0.5 remains authority until this exact candidate is independently reviewed, founder-promoted and merged</small></div></main>`;}
function taskGroup(t){return t.date<TODAY?'Overdue':t.date===TODAY?'Today':'Upcoming';}
function tasksFor(group,pId){return state.tasks.filter(t=>!t.done&&(!pId||t.pId===pId)&&!project(t.pId)?.completed&&taskGroup(t)===group);}
function taskRows(ts){return ts.length?`<div class="card">${ts.map(t=>row(typeIcon(t.action),t.title,`${project(t.pId)?.name||''} · ${t.date===TODAY?'Today':fmt(t.date)}`,`taskSheet('${t.id}')`,pill(t.source||taskGroup(t),t.source==='Suggestion'?'info':t.date<TODAY?'warn':''),t.date<TODAY?'warn':'')).join('')}</div>`:empty('Nothing waiting here','Breeder actions stay attached to their context. Upcoming work is in the next tab.','','check');}
function projectCard(p){const o=overlayFor(p),s=spawnFor(p),cs=activeCohorts(p),count=cs.reduce((n,c)=>n+c.count,0),uncertain=cs.some(c=>c.precision==='estimated'),outputs=reproductiveOutputs(p);const stageCount=p.stage==='Eggs'?`${s?.precision==='estimated'?'≈':''}${s?.eggs??'—'} eggs in latest ${o.batchNoun||'record'}`:`${uncertain?'≈':''}${count} in offspring groups`;return `<button type="button" class="card project-card" onclick="go('project/${p.id}')"><div class="card-top"><span class="species-avatar ${p.method==='shrimp'?'shrimp':p.method==='live'?'live':p.species.includes('Cory')?'cory':''}">${ico(p.method==='shrimp'?'shrimp':'fish')}</span><h3>${esc(p.name)}</h3><span class="chevron">${ico('chevron')}</span></div><div class="pills">${pill(p.completed?'Completed':p.stage,p.completed?'':'good')}${pill(p.form)}${pill(o.short,'info')}${p.stage==='Eggs'&&count?pill('Older offspring active','info'):''}</div><div class="project-meta"><span>${esc(p.species)}</span><span>${stageCount}</span></div><div class="project-meta"><span>${esc(tankName(p.tankId))}</span><span>${outputs.length?`${outputs.length} reproductive ${outputs.length===1?'record':'records'}`:'No reproductive output yet'}</span></div>${progress(p.stage)}</button>`;}
function progress(stage){let stages=['Conditioning','Paired','Eggs','Fry','Grow-out','Completed'],n=stages.indexOf(stage);return `<div class="progress" aria-label="Stage: ${esc(stage)}">${stages.map((s,i)=>`<i class="${i<n?'past':i===n?'current':''}"></i>`).join('')}</div>`;}
function homeScreen(){const active=state.projects.filter(p=>!p.completed),overdue=tasksFor('Overdue').length,today=tasksFor('Today').length;return heading('Your breeding day','Tuesday, 8 September',action('openQuick()','<span class="sr-only">Quick Log</span>','icon-btn','plus'))+`<div class="layout"><div><div class="hero"><div class="eyebrow">The fishroom, in focus</div><h2>${today?'Do the work.\nKeep the story.':'Room for the next generation.'}</h2><p>${today} actions today${overdue?` and ${overdue} overdue`:', with no overdue actions'}. Start from what happened; deeper Program details can wait until they are useful.</p><div class="mini-metrics"><div><b>${active.length}</b><span>Active programs</span></div><div><b>${activeCohorts().length}</b><span>Growing groups</span></div><div><b>${state.stock.filter(s=>s.originCohort).length}</b><span>Selected breeders</span></div></div><div class="round-launch mt16">${action('startRound()','Start breeder round','primary','check')}${action('openQuick()','Log what happened','secondary','plus')}</div><p class="tiny mt8">Routine checks stay fast. Parentage, counts and reproductive facts change only when you explicitly record them.</p></div>${section('Care with context',`<div class="tabs" aria-label="Agenda periods">${['Today','Overdue','Upcoming'].map(t=>action(`agenda='${t}';render()`,`${t} <span class="tiny">${tasksFor(t).length}</span>`,t===agenda?'active':'')).join('')}</div>${taskRows(tasksFor(agenda))}`)}${section('Keep parentage honest',`<div class="card pad"><div class="spread"><span class="row-icon info">${ico('lineage')}</span>${pill('Recorded evidence','info')}</div><h3 class="mt12">Use the source you actually know.</h3><p class="sub mt8">A Betta pair can carry exact parents. A Medaka batch can point to its breeding group. A shrimp recruitment can keep colony provenance without guessing sire or dam.</p>${nav('projects','Open breeding programs','link-btn','chevron')}</div>`)}</div><div>${section('Active programs',`<div class="stack">${active.slice(0,4).map(projectCard).join('')||empty('Your first breeding record starts here','Record what happened first; add deeper Program details later.',action('openQuick()','Log what happened','primary'))}</div>`,nav('projects','See all'))}${section('One tank history',`<div class="card">${row('book','Journal is already connected','Water, feeding and maintenance are shared records.',"go('integration')")}</div>`)}</div></div>`;}
function roundQueue(tankOnly=''){const map=new Map();const add=(p,c,t,reason,taskId='')=>{if(!p||p.completed&&!c?.active)return;const tankId=c?.tankId||p.tankId;if(tankOnly&&tankId!==tankOnly)return;const key=c?'c:'+c.id:'p:'+p.id;if(!map.has(key))map.set(key,{key,pId:p.id,cId:c?.id||'',tankId,reason,taskIds:[]});const item=map.get(key);if(taskId&&!item.taskIds.includes(taskId))item.taskIds.push(taskId);};state.tasks.filter(t=>!t.done&&!t.needsReassignment&&['Today','Overdue'].includes(taskGroup(t))).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const p=project(t.pId),c=t.cohortId?cohort(t.cohortId):null;if(c&&!c.active)return;add(p,c,t,taskGroup(t)+' · '+t.title,t.id);});activeCohorts().forEach(c=>add(project(c.pId),c,null,'Routine cohort check'));state.projects.filter(p=>!p.completed&&['Eggs','Conditioning','Paired'].includes(p.stage)).forEach(p=>add(p,null,null,p.stage==='Eggs'?'Egg-stage check':'Breeding-stock check'));return [...map.values()];}
function startRound(tankOnly=''){const queue=roundQueue(tankOnly);if(!queue.length){showSheet('Nothing to check here',banner(tankOnly?'No active breeder context is attached to this tank in the demo.':'No active breeder context is available.','info','check')+action("closeSheet();go('projects')",'Open projects','primary full mt16'));return;}roundSession={id:'round-'+(state.rounds?.length||0)+'-'+Date.now(),date:TODAY,tankOnly: tankOnly||'',queue,index:0,actions:[],skipped:[],started:true};lastRoundUndo=null;closeSheet();go('round');}
function currentRoundItem(){return roundSession?.queue?.[roundSession.index]||null;}
function roundTaskFor(item,type){return (item?.taskIds||[]).map(id=>byId(state.tasks,id)).find(t=>t&&!t.done&&t.action===type)||null;}
function roundRoutine(c){return c?.feedingRoutine||'';}
function roundDetailed(type){const item=currentRoundItem();if(!item)return;const t=roundTaskFor(item,type);logSheet(type,item.pId,item.cId,t?.id||'');}
function roundOneTap(kind){const item=currentRoundItem();if(!item)return;const p=project(item.pId),c=item.cId?cohort(item.cId):null;if(c&&(!c.active||c.tankId!==item.tankId))return toast('Context changed. Restart this round item.');lastRoundUndo={state:clone(state),round:clone(roundSession)};let title='',note='',eventType='observation';if(kind==='feed'){const routine=roundRoutine(c);if(!routine){lastRoundUndo=null;return roundDetailed('feed');}eventType='feed';title='Routine feeding confirmed';note=`Breeder Round · ${routine}. Existing routine reused; no amount or recommendation inferred.`;}else if(kind==='no-loss'){title='Round check · no losses observed';note='Breeder observed no losses during this check. This does not prove zero mortality between checks.';}else if(kind==='eggs-unchanged'){title='Egg stage checked · no visible change';note='Breeder Round observation. Egg count and hatch state were not changed.';}else if(kind==='no-hatch'){eventType='check';title='Expected hatch checked · no hatch observed';note='Breeder checked the egg stage. No hatch event or offspring count was fabricated.';}else if(kind==='no-change'){title='Round check · no change recorded';note='Breeder checked this context and recorded no material change.';}else{lastRoundUndo=null;return;}const e=addEvent(eventType,p,c,TODAY,title,note);if(kind==='feed')eventType='feed';const related=(item.taskIds||[]).map(id=>byId(state.tasks,id)).filter(Boolean);related.filter(t=>(kind==='feed'&&t.action==='feed')||(kind==='no-hatch'&&t.action==='hatch')).forEach(t=>{t.done=true;t.completedDate=TODAY;t.status='Completed';t.eventId=e.id;});roundSession.actions.push({kind,label:title,pId:p.id,cId:c?.id||'',tankId:item.tankId,eventId:e.id,eventScope:e.scope});persist();toastUndo(title);}
function toastUndo(message){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="snackbar has-action" role="status">${ico('check')}<span>${esc(message)}</span><button class="snack-action" type="button" onclick="undoRoundAction()">Undo</button></div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',6500);}
function undoRoundAction(){if(!lastRoundUndo)return;state=lastRoundUndo.state;roundSession=lastRoundUndo.round;lastRoundUndo=null;persist();toast('Last round action undone');}
function nextRoundItem(skip=false){if(!roundSession)return;if(skip){const item=currentRoundItem();roundSession.skipped.push({pId:item?.pId||'',cId:item?.cId||'',tankId:item?.tankId||''});}if(roundSession.index<roundSession.queue.length-1){roundSession.index++;render();window.scrollTo(0,0);}else finishRound();}
function finishRound(){if(!roundSession)return;const summary={id:roundSession.id,date:TODAY,total:roundSession.queue.length,actions:clone(roundSession.actions),skipped:clone(roundSession.skipped),tankOnly:roundSession.tankOnly||''};state.rounds=state.rounds||[];state.rounds.push(summary);roundSession={...roundSession,finished:true,summary};persist();go('round-summary');}
function roundActionCards(item,p,c){let actions=[];if(c){if(roundRoutine(c))actions.push(['feed','Fed',roundRoutine(c),'feed',true]);else actions.push(['detail-feed','Feed','Add food and portion','feed',false]);actions.push(['no-loss','No losses','Observed during this check','check',true]);actions.push(['count','Update count','Exact or estimated','count',false]);actions.push(['observation','Observation','Add a note or evidence','note',false]);}else if(p.stage==='Eggs'&&p.method==='collection'){actions=[['collection',outputActionLabel(p),`Add another ${overlayFor(p).batchNoun}`,'egg',false],['no-hatch','No hatch observed','Check only; no biological event','check',true],['hatch','Record hatch',`Observed hatch from an ${overlayFor(p).batchNoun}`,'cohort',false],['observation','Observation','Development / breeder note','note',false]];}else if(p.stage==='Eggs'){actions=[['eggs-unchanged','Eggs unchanged','No visible change','egg',true],['no-hatch','No hatch yet','Record the check only','check',true],['hatch','Record hatch','Creates offspring context','cohort',false],['eggcount','Update egg count','Keep the count basis explicit','count',false]];}else{actions=[['no-change','No change','Record a routine check','check',true],[outputAction(p),outputActionLabel(p),'Open the structured record',p.method==='shrimp'||p.method==='live'?'cohort':'egg',false],['feed','Feed','Use program/tank context','feed',false],['observation','Observation','Behaviour or breeder note','note',false]];}return `<div class="round-actions">${actions.map(([key,label,copy,icon,fast])=>action(fast?`roundOneTap('${key}')`:`roundDetailed('${key==='detail-feed'?'feed':key}')`,`${ico(icon)}<span><strong>${label}</strong><small>${copy}</small></span>`,`round-action ${fast?'primary-action':''}`)).join('')}</div>`;}
function roundScreen(){if(!roundSession||roundSession.finished)return heading('Breeder round','Fast checks with the right context already attached.')+`<div class="narrow">${empty('Start with the fishroom, not a blank form','Draneka builds a round from overdue/today work plus active breeding contexts.',action('startRound()','Start breeder round','primary','check'))}${section('Physical tank shortcut',`<div class="card">${row('search','Open a tank label','Prototype the QR/label entry without camera access.',"tankShortcutSheet()")}</div>`)}${state.rounds?.length?section('Recent rounds',`<div class="card pad">${state.rounds.slice(-4).reverse().map(r=>`<div class="round-history-row"><div><strong>${esc(r.tankOnly?tankName(r.tankOnly):'Fishroom round')}</strong><small>${fmt(r.date)} · ${r.actions.length} recorded · ${r.skipped.length} skipped</small></div><b>${r.total}</b></div>`).join('')}</div>`):''}</div>`;const item=currentRoundItem(),p=project(item.pId),c=item.cId?cohort(item.cId):null,done=roundSession.index,percent=Math.round((done/roundSession.queue.length)*100),tasks=(item.taskIds||[]).map(id=>byId(state.tasks,id)).filter(t=>t&&!t.done);return heading('Breeder round',roundSession.tankOnly?`Tank label · ${tankName(roundSession.tankOnly)}`:'Fishroom check')+`<div class="narrow"><div class="spread"><span class="round-count">${roundSession.index+1} of ${roundSession.queue.length}</span><span class="tiny">${roundSession.actions.length} records saved</span></div><div class="round-progress" aria-label="Round progress"><i style="width:${percent}%"></i></div><div class="round-context"><div class="context-lock">${ico('lock')}Context locked for this check</div><div class="spread start mt12"><div><div class="eyebrow">${esc(tankName(item.tankId))}</div><h2>${esc(c?.name||p.name)}</h2><p class="sub mt8">${esc(c?`${p.name} · ${c.stage} · ${countText(c)} recorded animals`:`${p.species} · ${p.stage}`)}</p></div>${pill(c?c.stage:p.stage,'good')}</div>${tasks.length?`<div class="pills mt12">${tasks.map(t=>pill(taskGroup(t)+' · '+t.title,t.date<TODAY?'warn':'info')).join('')}</div>`:`<p class="tiny mt12">${esc(item.reason)} · no repeated project, species, tank or cohort selection required.</p>`}</div>${speciesRoundCue(p)}${roundActionCards(item,p,c)}<div class="buttons mt16">${action('nextRoundItem(true)','Skip for now','secondary')}${action('nextRoundItem(false)',roundSession.index===roundSession.queue.length-1?'Finish round':'Next tank','primary','chevron')}</div><div class="card pad mt20"><h3>Fish-room tools</h3><p class="sub mt8">Use one bulk confirmation only when the same routine actually applies to each selected cohort.</p><div class="buttons mt12">${action('bulkFeedSheet()','Bulk routine feed','secondary','feed')}${action('tankShortcutSheet()','Tank label','secondary','search')}</div></div><p class="footnote">One-tap routine events still create normal Draneka records. Feeding remains a shared care event visible in Journal; breeder-only observations stay in Breeder. Counts, mortality, hatch, moves, splits and dispositions are never silently inferred.</p></div>`;}
function roundSummaryScreen(){const r=roundSession?.summary||state.rounds?.at(-1);if(!r)return roundScreen();const shared=r.actions.filter(a=>a.eventScope==='shared').length,checks=r.actions.filter(a=>a.eventScope!=='shared').length;return heading('Round complete',r.tankOnly?tankName(r.tankOnly):'Fishroom summary')+`<div class="narrow"><div class="hero"><div class="eyebrow">Breeder round saved</div><h2>${r.total} contexts checked.</h2><p>${r.actions.length} records saved${r.skipped.length?` · ${r.skipped.length} skipped`:''}. Routine care is recorded once in its underlying Draneka history.</p></div><div class="round-summary-grid mt16">${metric(String(r.actions.length),'Records saved')}${metric(String(shared),'Shared care events')}${metric(String(checks),'Breeder observations')}${metric(String(r.skipped.length),'Skipped contexts')}</div>${section('What was recorded',r.actions.length?`<div class="card">${r.actions.map(a=>{const p=project(a.pId),c=a.cId?cohort(a.cId):null;return row(typeIcon(a.kind),a.label,`${c?.name||p?.name||'Context'} · ${tankName(a.tankId)}`,`go('${c?'cohort/'+c.id:'project/'+p.id}')`,pill(a.eventScope==='shared'?'Journal + Breeder':'Breeder',a.eventScope==='shared'?'info':''));}).join('')}</div>`:empty('No records were added','Skipped contexts are not converted into husbandry records.','','check'))}<div class="buttons mt20">${action('startRound()','Start another round','secondary','refresh')}${nav('home','Back to Today','primary','home')}</div></div>`;}
function tankShortcutSheet(){showSheet('Tank label shortcut',`${banner('Prototype only: choose a physical tank label below. A production version could use QR/OCR, but this candidate does not request camera access.','info','search')}<div class="tank-label-grid mt16">${state.tanks.map(t=>`<button type="button" class="tank-label" onclick="startRound('${t.id}')"><code>${esc(t.code)}</code><strong>${esc(t.name)}</strong><small>${esc(t.note)}</small></button>`).join('')}</div>`,'Jump into the correct breeder context');}
function bulkFeedSheet(){const cs=activeCohorts().filter(c=>roundRoutine(c));showSheet('Bulk routine feed',`${banner('Select only cohorts that actually received their already-recorded routine. One confirmation creates one shared care event per selected cohort; it does not fabricate quantities.','info','feed')}<form onsubmit="event.preventDefault();saveBulkFeed()"><div class="bulk-list mt16">${cs.map(c=>`<label class="bulk-row"><input type="checkbox" name="bulk-feed" value="${c.id}"><span><strong>${esc(c.name)}</strong><small>${esc(tankName(c.tankId))} · ${esc(roundRoutine(c))}</small></span></label>`).join('')}</div>${formFooter('Record selected feeds')}</form>`);}
function saveBulkFeed(){const ids=[...document.querySelectorAll('input[name=bulk-feed]:checked')].map(x=>x.value);if(!ids.length)return formError('Select at least one cohort that was actually fed.');lastRoundUndo={state:clone(state),round:clone(roundSession)};const saved=[];for(const id of ids){const c=cohort(id),p=project(c?.pId);if(!c?.active||!p||!roundRoutine(c)){state=lastRoundUndo.state;roundSession=lastRoundUndo.round;lastRoundUndo=null;return formError('One selected cohort no longer has valid routine-feed context. Reopen the bulk action.');}const e=addEvent('feed',p,c,TODAY,'Routine feeding confirmed',`Bulk Breeder Round · ${roundRoutine(c)}. Existing breeder-recorded routine reused; no amount inferred.`);state.tasks.filter(t=>!t.done&&!t.needsReassignment&&t.cohortId===c.id&&t.action==='feed'&&['Today','Overdue'].includes(taskGroup(t))).forEach(t=>{t.done=true;t.completedDate=TODAY;t.status='Completed';t.eventId=e.id;});saved.push({kind:'feed',label:'Routine feeding confirmed',pId:p.id,cId:c.id,tankId:c.tankId,eventId:e.id,eventScope:e.scope});}if(roundSession)roundSession.actions.push(...saved);closeSheet();persist();toastUndo(`${saved.length} routine feeds recorded`);}

function projectsScreen(){const filtered=state.projects.filter(p=>(projectFilter==='All'||(projectFilter==='Completed'?p.completed:!p.completed))&&(`${p.name} ${p.species} ${p.line}`).toLowerCase().includes(searchTerm.toLowerCase()));return heading('Breeding programs','Keep each breeding line together without slowing daily work.',action('newProject()','<span class="sr-only">New breeding program</span>','icon-btn','plus'))+`<div class="context-callout mb12"><h3>Programs hold the breeding story. They do not block the work.</h3><p>Start with a pair, an egg collection, a brood or a colony observation. Add goals and deeper lineage detail only when they help.</p></div><div class="searchbox">${ico('search')}<input aria-label="Search programs" placeholder="Search a program, species or line" value="${esc(searchTerm)}" oninput="filterProjects(this.value)"></div><div class="filter-row">${['Active','Completed','All'].map(f=>action(`projectFilter='${f}';render()`,f,`chip ${projectFilter===f?'active':''}`)).join('')}</div><div id="project-results" class="project-grid">${filtered.map(projectCard).join('')||empty('No matching programs','Try another search or start from a breeding event.',action('openQuick()','Log what happened','primary'))}</div>`;}
function filterProjects(value){searchTerm=value;const ps=state.projects.filter(p=>(projectFilter==='All'||(projectFilter==='Completed'?p.completed:!p.completed))&&(`${p.name} ${p.species} ${p.line}`).toLowerCase().includes(value.toLowerCase()));$('#project-results').innerHTML=ps.map(projectCard).join('')||empty('No matching projects','Try another project name or species.');}
// Spawns freeze parentage at the event; a later pairing must not rewrite existing ancestry.

function setTab(t){tab=t;render();}
function projectScreen(id){const p=project(id);if(!p)return notFound();const s=spawnFor(p),cs=activeCohorts(p),stage=p.completed?'Completed':p.stage;const tabs=[['Overview','Overview'],['Cohorts','Offspring'],['Timeline','Timeline'],['More','More']];return heading(p.name,p.species,action(`openQuick('${id}')`,'<span class="sr-only">Quick Log for this breeding context</span>','icon-btn','plus'),true)+`<div class="pills mb12">${pill(stage,p.completed?'':'good')}${pill(p.form)}${pill(overlayFor(p).short,'info')}${pill(p.line||'Line not recorded')}</div><div class="tabs" aria-label="Program sections">${tabs.map(([key,label])=>action(`setTab('${key}')`,label,key===tab?'active':'')).join('')}</div>`+(tab==='Overview'?projectOverview(p,s,cs):tab==='Cohorts'?section('Offspring groups',cohortCards(cs),action(`openQuick('${id}')`,'Quick Log','link-btn')):tab==='Timeline'?eventTimeline(state.events.filter(e=>e.pId===id)):projectMore(p));}
function projectOverview(p,s,cs){const o=overlayFor(p);let next,label,copy;if(p.completed){label='A chapter completed.';copy=p.outcome||'Your breeding record is preserved.';next=nav('analytics/'+p.id,'Review program outcomes','primary','chart');}else if(p.stage==='Conditioning'){label='Start with the breeder context you actually know.';copy='Connect breeding stock when it is known. Unknown, group and population sources remain valid.';next=action(`pairingSheet('${p.id}')`,'Add breeding stock / source','primary','lineage');}else if(p.stage==='Paired'){label=p.method==='collection'?'Keep one Program. Add each collection.':p.method==='egg'?'Watch. Observe. Record.':p.method==='live'?'Ready to record a brood.':'Follow the population, not a guessed pair.';copy='Record what actually happened. Dates, counts and source confidence come from your observations.';next=action(`logSheet('${outputAction(p)}','${p.id}')`,outputActionLabel(p),'primary',p.method==='shrimp'||p.method==='live'?'cohort':'egg');}else if(p.stage==='Eggs'&&p.method==='collection'){const opens=openEggOutputs(p);label=`${s?.precision==='estimated'?'About ':''}${s?.eggs??'—'} eggs in the latest ${o.batchNoun}.`;copy=`${s?.label||'Latest '+o.batchNoun} · ${opens.length} open ${opens.length===1?o.batchNoun:o.batchPlural}. ${o.collectionNote||'Repeated outputs stay inside this Program.'}`;next=`<div class="buttons mt16">${action(`logSheet('collection','${p.id}')`,outputActionLabel(p),'primary','egg')}${opens.length?action(`logSheet('hatch','${p.id}')`,'Record a hatch','secondary','cohort'):''}</div>`;}else if(p.stage==='Eggs'){label=`${s?.precision==='estimated'?'About ':''}${s?.eggs??'—'} eggs. A new beginning.`;copy=`${s?.label||'Spawn'} · recorded ${fmt(s?.date)}. ${s?.expected?`Hatch check planned for ${fmt(s.expected)}.`:'Record a hatch when observed.'}`;next=action(`logSheet('hatch','${p.id}')`,'Record hatch','primary','egg');}else{const n=cs.reduce((a,c)=>a+c.count,0);label=`${cs.some(c=>c.precision==='estimated')?'About ':''}${n} growing. Every one connected.`;copy=`${s?.label||'Offspring'} · ${cs.length} ${cs.length===1?'offspring group':'offspring groups'}. ${p.method==='shrimp'?'Breeding-population provenance stays attached; exact parents stay unknown unless recorded.':'Counts, development and lineage stay together.'}`;next=cs.length?nav('cohort/'+cs[0].id,'Open growing group','primary','cohort'):action(`openQuick('${p.id}')`,'Quick Log','primary','plus');}
const stageList=p.method==='egg'?['Conditioning','Paired','Eggs','Fry','Grow-out']:p.method==='collection'?['Conditioning','Paired','Eggs','Fry','Grow-out']:['Conditioning','Paired','Fry','Grow-out'];return `<div class="layout"><div class="stack"><div class="hero"><div class="eyebrow">${esc(stageLabel(p))}</div><h2>${esc(label)}</h2><p>${esc(copy)}</p>${next}<div class="program-lite">${pill(p.form)}${p.method==='collection'?pill('Repeated egg batches'):p.method==='shrimp'?pill('Population source recorded'):pill('Breeding record')}</div><ol class="stage-strip">${stageList.map((st,i)=>`<li class="${i<stageList.indexOf(p.stage)?'past':st===p.stage?'current':''}"><i></i>${st==='Paired'&&p.method==='shrimp'?'Population':st==='Paired'&&p.method==='collection'?'Breeding group':st}</li>`).join('')}</ol></div>${speciesOverlaySection(p)}${p.completed&&cs.some(c=>c.count>0)?banner('Program closed; living offspring remain in Grow-out. Their care tasks and logging stay active.','info','cohort'):''}${s?spawnSummary(p,s):''}${p.method==='collection'?section(overlayFor(p).batchPlural,reproductiveOutputRows(p),action(`logSheet('collection','${p.id}')`,outputActionLabel(p),'link-btn','plus')):''}${section('Breeding stock & source',`<div class="card">${p.stockIds.map(sid=>{const st=stock(sid);return st?row(st.kind==='Group'?'cohort':'fish',st.name,`${st.sex} · ${st.kind}`,`go('stock/${st.id}')`):'';}).join('')||row('lineage','Stock not assigned','Unknown parents are valid; do not guess.',`pairingSheet('${p.id}')`)}${row('lineage','What is actually known',p.parentage,`go('lineage/${p.id}')`)}</div>`,!p.completed?action(`pairingSheet('${p.id}')`,'Breeding stock details','link-btn'):'')}${section('Program notes',`<div class="card pad"><p class="note-box">${esc(p.goal||'No breeding goal recorded. Add one only if it helps this work.')}</p><p class="tiny mt12">Generation label: ${esc(p.generation||'Not recorded')}. Visible traits do not establish genotype; group provenance does not establish exact individual parentage.</p></div>`)}</div><div>${section('Linked location',`<div class="card">${row('tank',tankName(p.tankId),'Shared with Journal · location does not own ancestry',`go('tank/${p.tankId}')`)}</div>`)}${section('Next breeder actions',taskRows(state.tasks.filter(t=>!t.done&&t.pId===p.id)),!p.completed?action(`planSheet('${p.id}')`,'Plan action','link-btn'):'')}${section('Program tools',`<div class="card">${row('chart','Compare breeding outcomes','Counts with explicit denominators',`go('analytics/${p.id}')`)}${row('camera','Photos & observations','Evidence, not genetic certainty',`go('media/${p.id}')`)}${row('info','Species overlay','Terminology and guidance around the same core Program',`speciesGuideSheet('${p.id}')`)}${row('info','How Draneka treats records','Checks, observations and derived states stay separate',`evidenceHelpSheet()` )}</div>`)}</div></div>`;}
function stageLabel(p){return p.completed?'Program review':overlayFor(p).contextLabel||(p.method==='shrimp'?'Population / colony context':p.method==='collection'?'Repeated egg-collection context':p.method==='live'?'Livebearer context':'Discrete spawn context');}
function spawnSummary(p,s){const isEgg=p.method==='egg'||p.method==='collection',offspring=isEgg?totalHatched(s):Number(s.hatched||0),hasOffspringRecord=isEgg?hatchRecords(s).length:s.hatched!==null&&s.hatched!==undefined,rate=isEgg&&hasOffspringRecord&&s.eggs>0?Math.round(offspring/s.eggs*100):isEgg&&hasOffspringRecord&&offspring===0?0:null,kind=outputKind(p,s),remaining=isEgg?eggRemaining(s):null,open=isEgg&&eggOutputOpen(s);return `<div class="card pad"><div class="spread"><div><div class="output-kind">${kind}</div><h3>${esc(s.label)}</h3></div>${pill(s.historical?'Historical':open?'Open record':'Recorded','info')}</div><div class="metrics ${isEgg?'':'two'} mt16">${isEgg?metric(s.eggs===null?'—':`${s.precision==='estimated'?'≈':''}${s.eggs}`,p.method==='collection'?'Eggs collected':'Eggs recorded',`Recorded ${fmt(s.date)}`):''}${metric(hasOffspringRecord?`${s.hatchPrecision==='estimated'?'≈':''}${offspring}`:'—',p.method==='shrimp'?'Juveniles observed':p.method==='live'?'Fry born':'Fry hatched',isEgg?(hasOffspringRecord?`${hatchRecords(s).length} hatch observation${hatchRecords(s).length===1?'':'s'}`:'Not observed'):(s.hatchDate?fmt(s.hatchDate):'Not observed'))}${metric(rate===null?'—':`${s.precision==='estimated'||s.hatchPrecision==='estimated'?'≈':''}${rate}%`,'Hatch / recorded eggs',!isEgg?'Not applicable':'Recorded egg denominator')}</div>${s.removed?`<p class="tiny mt12">${s.removed} eggs removed; original count is retained for the recorded denominator.</p>`:''}${open&&remaining!==null?`<p class="tiny mt12">${remaining} recorded eggs remain available for later hatch observations.</p>`:''}${p.method==='collection'?`<p class="stress-note">This batch stays separate inside the same Program. The breeding group is known; individual egg parentage is not assigned.</p>`:''}</div>`;}
function reproductiveOutputRows(p){const outputs=reproductiveOutputs(p).slice().reverse();if(!outputs.length)return empty('No breeding output yet','Record an observed spawn, brood, egg collection or recruitment event.');return `<div class="card output-list">${outputs.map(s=>{const open=eggOutputOpen(s),hatched=totalHatched(s),remaining=eggRemaining(s);const status=open?(s.eggs===null?'open count':`open · ${remaining===null?'unknown':remaining} eggs remaining`):hatchRecords(s).length?`${s.hatchPrecision==='estimated'?'≈':''}${hatched} offspring recorded`:'recorded';return row('egg',s.label,`${outputKind(p,s)} · ${fmt(s.date)} · ${status}`,open&&(p.method==='egg'||p.method==='collection')?`logSheet('hatch','${p.id}','','','','${s.id}')`:`go('timeline')`,pill(open?'Open':'Recorded',open?'info':''));}).join('')}</div>`;}

function projectMore(p){return `<div class="narrow stack"><div class="card">${row('chart','Program analytics','Reproductive output, survival and condition comparisons',`go('analytics/${p.id}')`)}${row('lineage','Lineage','Parent records, source groups and descendants',`go('lineage/${p.id}')`)}${row('camera','Media','Record photographs with the right context',`go('media/${p.id}')`)}${row('tank','Environment history',tankName(p.tankId),`go('tank/${p.tankId}')`)}${row('download','Export program record','JSON with offspring groups, events and source identifiers',`exportProject('${p.id}')`)}</div>${!p.completed?`<div class="card">${row('egg',outputActionLabel(p),p.method==='collection'?'Repeated collections stay in the same Program.':'Older offspring keep their original parentage.',`logSheet('${outputAction(p)}','${p.id}')`)}${row('flag','Complete & review program','Preserve living offspring groups and all their history.',`completeSheet('${p.id}')`)}</div>`:`<div class="card pad"><h3>Completed ${fmt(p.completedDate)}</h3><p class="sub mt8">${esc(p.outcome)}</p><p class="sub mt8">${esc(p.lessons)}</p>${action(`reopenProject('${p.id}')`,'Reopen program','secondary full mt16','refresh')}</div>`}</div>`;}
function cohortCards(cs){return cs.length?`<div class="stack">${cs.map(c=>`<div class="card">${row('cohort',c.name,`${tankName(c.tankId)} · ${c.stage}`,`go('cohort/${c.id}')`,`<strong>${countText(c)}</strong><small>${c.precision==='estimated'?'estimated':'counted'}</small>`)}</div>`).join('')}</div>`:empty('No offspring cohort yet','Record a hatch, birth or first juvenile observation. A whole group becomes one cohort, not hundreds of individual records.');}
function growoutScreen(){const cs=activeCohorts().filter(c=>(growFilter==='All'||c.stage===growFilter));return heading('Growing offspring','Count together. Separate or combine only when it helps the work.')+`<div class="hero"><div class="spread"><div><div class="eyebrow">Groups, not hundreds of profiles</div><h2>${activeCohorts().length} groups in care</h2><p>Move, split, merge, adjust counts and promote selected animals. Source provenance follows every operation.</p></div><span class="row-icon">${ico('cohort')}</span></div></div><div class="filter-row">${['All','Fry','Grow-out'].map(f=>action(`growFilter='${f}';render()`,f,`chip ${growFilter===f?'active':''}`)).join('')}</div><div class="project-grid">${cs.map(c=>`<button class="card project-card" onclick="go('cohort/${c.id}')"><div class="spread start"><div><div class="eyebrow">${esc(project(c.pId)?.line||'Offspring')}</div><h3>${esc(c.name)}</h3></div>${pill(c.stage,'good')}</div><div class="countbig mt16">${countText(c)} <small>in group</small></div><p class="sub mt8">${esc(tankName(c.tankId))}</p><div class="pills mt12">${cohortSourceOutputs(c).length>1?pill(`${cohortSourceOutputs(c).length} source outputs`,'info'):cohortSourceHatches(c).length>1?pill(`${cohortSourceHatches(c).length} hatch observations`,'info'):''}${c.mergedFrom?.length?pill('Merged group','info','merge'):''}</div><div class="project-meta"><span>${esc(cohortSourceLabel(c))} · ${esc(cohortAgeText(c))}</span><span>${c.precision==='estimated'?'Estimate':'Exact count'}</span></div>${progress(c.stage)}</button>`).join('')||empty('No groups in this stage','Try another filter or record offspring from a Program.')}</div>${section('After split or merge',banner('Historical source groups remain in the record but are excluded from live inventory. Descendants and merged groups carry forward the recorded source output and hatch provenance.','info','merge'))}`;}
function cohortScreen(id){const c=cohort(id);if(!c)return notFound();const p=project(c.pId),s=spawn(c.spawnId),children=state.cohorts.filter(x=>x.parentId===id),mergedTarget=c.mergedInto?cohort(c.mergedInto):null;const provenance=cohortSourceSummary(c),ageCopy=cohortAgeText(c);if(!c.active){const changed=c.mergedInto?'merged':'split';return heading(c.name,`${p.species} · historical ${changed} source`,'',true)+`<div class="breadcrumb">${nav('project/'+p.id,p.name)}${ico('chevron')}<span>Historical offspring group</span></div><div class="narrow stack">${c.mergedInto?banner(`<strong>This group was merged.</strong>Its quantity moved into ${esc(mergedTarget?.name||'a merged group')}. The original source remains here for provenance and is not counted twice.`,'info','merge'):banner('This group was split. It is retained as ancestry/provenance, not counted again in live inventory.','info','split')}${c.mergedInto&&mergedTarget?nav('cohort/'+mergedTarget.id,'Open merged group','primary full','merge'):cohortCards(children)}${nav('lineage/'+p.id,'View the whole lineage','secondary full','lineage')}${section('Group history',eventTimeline(state.events.filter(e=>e.cohortId===id)))}</div>`;}return heading(c.name,`${p.species} · ${cohortSourceLabel(c)}`,'',true)+`<div class="breadcrumb">${nav('project/'+p.id,p.name)}${ico('chevron')}<span>Offspring group</span></div><div class="layout"><div class="stack"><div class="hero"><div class="spread"><div class="eyebrow">${esc(c.stage)} · ${esc(ageCopy)}</div>${pill(c.precision==='estimated'?'Estimate':'Exact count',c.precision==='estimated'?'warn':'good')}</div><div class="countbig mt8">${countText(c)} <small>${p.method==='shrimp'?'juveniles':'offspring'}</small></div><p>${esc(tankName(c.tankId))}</p>${c.mergedFrom?.length?`<div class="pills mt12">${pill(`Merged from ${c.mergedFrom.length} groups`,'info','merge')}${cohortSourceOutputs(c).length>1?pill(`${cohortSourceOutputs(c).length} source outputs`,'warn'):''}</div>`:''}<div class="buttons mt16">${action(`openQuick('${p.id}','${c.id}')`,'Quick Log','primary','plus')}${action(`logSheet('count','${p.id}','${c.id}')`,'Update count','secondary','count')}</div></div>${c.adjustment!==0?banner(`<strong>Unexplained count revision</strong>${Math.abs(c.adjustment)} ${c.adjustment<0?'fewer':'more'} than the ledger expectation. This is not recorded mortality; survival is not asserted.`, 'warn','count'):''}<div class="metrics">${metric(c.losses,'Recorded losses','On this group only')}${metric(c.retained,'Selected as stock','Excluded from group count')}${metric(c.outgoing,'Live exits','Not classified as mortality')}</div><div class="card"><div class="row-group-title">Group operations</div>${row('move','Move whole group','Keep one group; change its tank.',`logSheet('move','${p.id}','${c.id}')`)}${row('split','Split group','Create two groups; both keep the source provenance.',`logSheet('split','${p.id}','${c.id}')`)}${row('merge','Merge with another group','Combine quantities without erasing source output or hatch provenance.',`logSheet('merge','${p.id}','${c.id}')`)}${row('flag','Change life stage','Update the observed stage without changing count or lineage.',`logSheet('stage','${p.id}','${c.id}')`)}${row('stock','Select a future breeder','Promote one animal to a named stock record.',`logSheet('select','${p.id}','${c.id}')`)}${row('transfer','Sale, gift or transfer','Record a live exit with its provenance.',`logSheet('transfer','${p.id}','${c.id}')`)}</div>${section('Development',`<div class="card pad">${c.milestones.length?c.milestones.map(m=>`<div class="plan-row"><span class="row-icon">${ico('flag')}</span><div><strong>${esc(m.label)}</strong><p>${fmt(m.date)} · keeper observation</p></div></div>`).join(''):'<p class="sub">No milestones recorded yet.</p>'}${action(`logSheet('milestone','${p.id}','${c.id}')`,'Record development','link-btn','plus')}</div>`)}${c.measurements.length?growthCard(c):''}</div><div>${section('Always connected',`<div class="card">${row('lineage','Source provenance',provenance,`go('lineage/${p.id}')`)}${row('tank','Current tank conditions',tankName(c.tankId),`go('tank/${c.tankId}')`)}</div>`)}${section('Recent group history',eventTimeline(state.events.filter(e=>e.cohortId===id).slice(-10)))}${section('Count & provenance basis',`<div class="card pad"><p class="sub">${c.precision==='estimated'?'This quantity is an estimate; splits and merges keep that uncertainty visible.':'This quantity is recorded as an exact count unless it is later combined with an estimated group.'} Future counts are new observations, never silent rewrites.</p><div class="divider"></div><p class="tiny">Source output${cohortSourceOutputs(c).length===1?'':'s'}: ${esc(cohortSourceOutputs(c).join(', ')||'not recorded')}<br>Source hatch${cohortSourceHatches(c).length===1?'':'es'}: ${esc(cohortSourceHatches(c).join(', ')||'not recorded')}<br>Group ID: ${esc(c.id)}</p></div>`)}</div></div>`;}
function growthCard(c){const ms=c.measurements,vals=ms.map(m=>m.mm),max=Math.max(...vals,1),points=ms.map((m,i)=>`${35+i*(260/Math.max(ms.length-1,1))},${125-m.mm/max*95}`).join(' ');return section('Growth observations',`<div class="card pad"><div class="spread"><h3>Mean sampled length</h3>${pill('Observation','info')}</div><svg class="chart-svg" viewBox="0 0 330 155" role="img" aria-label="Mean length observations in millimetres"><path d="M35 20v105h270" stroke="#cbded4" fill="none"/><polyline points="${points}" fill="none" stroke="#126d63" stroke-width="2.5"/>${ms.map((m,i)=>`<circle cx="${35+i*(260/Math.max(ms.length-1,1))}" cy="${125-m.mm/max*95}" r="4" fill="#126d63"/><text x="${35+i*(260/Math.max(ms.length-1,1))}" y="${115-m.mm/max*95}" text-anchor="middle" fill="#315348" font-size="10">${m.mm} mm</text><text x="${35+i*(260/Math.max(ms.length-1,1))}" y="145" text-anchor="middle" fill="#62736f" font-size="9">${fmt(m.date)}</text>`).join('')}</svg><p class="tiny">${ms.map(m=>`${fmt(m.date)}: n=${m.n}`).join(' · ')}. Samples are observations, not the size of every animal.</p>${action(`logSheet('measurement','${c.pId}','${c.id}')`,'Add measurement','link-btn','measure')}</div>`);}
function stockScreen(){return heading('Breeding stock','Shared livestock, with breeder-specific context.',action("go('lineage/p1')",'<span class="sr-only">Lineage</span>','icon-btn','lineage'))+section('Individuals & groups',`<div class="card">${state.stock.filter(s=>!s.ancestorOnly).map(s=>row(s.kind==='Group'?'cohort':s.originCohort?'stock':'fish',s.name,`${s.species} · ${s.sex}`,`go('stock/${s.id}')`,pill(s.originCohort?s.ready?'Breeder':'Candidate':s.kind,s.originCohort?'good':''))).join('')}</div>`)+section('Keep young animals together',banner('Only selected offspring need individual profiles. The rest remain in their cohort.','','cohort'));}
function stockDetail(id){const st=stock(id);if(!st)return notFound();const projects=state.projects.filter(p=>p.stockIds.includes(id)||state.spawns.some(s=>s.pId===p.id&&(s.stockIds||[]).includes(id))),parents=stockParents(id),coverage=pedigreeCoverage(id),pairEligible=pairBuilderEligible(st);return heading(st.name,st.species,pairEligible?action(`openPairBuilder('${id}')`,'Pair builder','secondary','lineage'):'',true)+`<div class="layout"><div class="stack"><div class="card pad"><div class="spread"><span class="species-avatar ${st.species.includes('Neocaridina')?'shrimp':''}">${ico(st.kind==='Group'?'cohort':'fish')}</span>${pill(st.originCohort?st.ready?'Breeding readiness recorded':'Candidate breeder':st.kind,'good')}</div><h2 class="mt16">${esc(st.line||'Line not recorded')}</h2>${details([['Sex',st.sex],['Generation',st.generation||'Not recorded'],['Current tank',tankName(st.tankId)],['Birth date',st.born?fmt(st.born):'Not recorded'],['Record type',st.kind],...(st.quantity?[['Recorded group size',String(st.quantity)]]:[])])}</div><div class="card pad"><div class="pills">${pill('Observation','info')}</div>${st.provenanceAmbiguous?banner('<strong>Combined-source ancestry remains unresolved</strong>This individual was selected from a group carrying more than one possible source path. The candidate keeps those source IDs but no exact parents are asserted.','warn','lineage'):''}<h3 class="mt12">Recorded phenotype</h3><p class="sub mt8">${esc(st.trait||'No traits recorded.')}</p><div class="divider"></div><h3>Genotype</h3><p class="sub mt8">Not established. Appearance alone is not genetic evidence.</p></div>${st.originCohort&&!st.ready?`<div class="card pad"><h3>Selected, not automatically ready</h3><p class="sub mt8">Record maturity and your readiness assessment before using this individual in a breeding arrangement.</p>${action(`readinessSheet('${id}')`,'Record breeding readiness','secondary full mt16')}</div>`:''}</div><div>${section('Recorded ancestry',`<div class="card pad">${parents.length?`<div class="parents">${parents.map(p=>`<button class="node" onclick="go('stock/${p.id}')">${ico('fish')}<strong class="mt8">${esc(p.name)}</strong><small>${esc(p.generation||'Generation not recorded')} · ${esc(p.line||'Line not recorded')}</small></button>`).join('')}</div>`:`<div class="unknown-parentage"><strong>Earlier ancestors not recorded</strong><p class="tiny mt8">This does not mean unrelated. Draneka preserves the gap rather than inventing parentage.</p></div>`}<div class="coverage-grid"><div class="coverage"><strong>${coverage.known}/${coverage.total}</strong><span>known ancestor slots · 3 generations</span></div><div class="coverage"><strong>${pedigreeDepth(id)} generation${pedigreeDepth(id)===1?'':'s'}</strong><span>recorded pedigree depth</span></div></div></div>`)}${section('Provenance',`<div class="card pad"><p class="sub">${esc(st.source)}</p>${st.originCohort?`<div class="mt12">${nav('cohort/'+st.originCohort,'Source offspring group','secondary full','cohort')}</div><div class="mt8">${nav('lineage/'+cohort(st.originCohort).pId,'View ancestry','secondary full','lineage')}</div>`:`<p class="tiny mt12">No claim of unrelatedness is made when earlier ancestors are absent.</p>`}</div>`)}${section('Breeding history',projects.length?`<div class="card">${projects.map(p=>row('lineage',p.name,`${p.stockIds.includes(id)?'Recorded arrangement':'Historical reproductive source'} · ${p.stage}`,`go('project/${p.id}')`)).join('')}</div>`:pairEligible?empty('No breeding arrangements recorded','Use Pair Builder to review recorded relationships before creating a future arrangement.',action(`openPairBuilder('${id}')`,'Open Pair Builder','secondary','lineage'),'lineage'):empty('No breeding arrangement recorded','This animal keeps its source-population provenance. Draneka does not force a pair history where none exists.','','lineage'))}</div></div>`;}
function ancestorChip(st){return st?`<button class="ancestor-chip" onclick="go('stock/${st.id}')">${esc(st.name)}<br><small>${esc(st.generation||'Generation ?')}</small></button>`:`<div class="ancestor-chip unknown">Unknown ancestor</div>`;}
function parentFamily(st){const ps=stockParents(st.id);return `<div class="lineage-family"><div class="lineage-family-label">${esc(st.sex)} ancestry</div><div class="ancestor-pair">${ancestorChip(ps[0])}${ancestorChip(ps[1])}</div><div class="lineage-arrow">↓</div><button class="lineage-parent" onclick="go('stock/${st.id}')"><strong>${esc(st.name)}</strong><small>${esc(st.generation||'Generation not recorded')} · ${esc(st.line||'Line not recorded')}</small></button></div>`;}
function lineageScreen(id){const p=project(id);if(!p)return notFound();const s=(lineageSelected&&spawn(lineageSelected)?.pId===id?spawn(lineageSelected):spawnFor(p)),parents=(s?.stockIds||p.stockIds).map(stock).filter(Boolean),roots=state.cohorts.filter(c=>c.pId===id&&!c.parentId&&!c.mergedFrom?.length&&cohortSourceOutputs(c).includes(s?.id)),selected=state.stock.filter(x=>x.originCohort&&(x.sourceOutputIds||[x.originSpawn]).includes(s?.id)),lineStock=state.stock.filter(x=>!x.ancestorOnly&&x.line===p.line&&x.kind==='Individual'),knownAncestors=new Set(lineStock.flatMap(x=>[...ancestorDistances(x.id).keys()]));const pairBtn=parents.some(x=>x.kind==='Individual')?action(`openPairBuilder('${parents.find(x=>x.kind==='Individual')?.id||''}')`,'Try Pair Builder','secondary','lineage'):'';return heading('Lineage',p.name,pairBtn,true)+`<div class="mb12">${select('lineage-spawn','View ancestry for',state.spawns.filter(x=>x.pId===id).map(x=>[x.id,x.label+' · '+fmt(x.date)]),s?.id)}</div>${section('Line at a glance',`<div class="card pad"><div class="line-summary"><div class="line-stat"><strong>${esc(p.line||'—')}</strong><span>line / strain</span></div><div class="line-stat"><strong>${esc(p.generation||'—')}</strong><span>offspring generation</span></div><div class="line-stat"><strong>${lineStock.length}</strong><span>living/retained individual records</span></div><div class="line-stat"><strong>${knownAncestors.size}</strong><span>known ancestor records</span></div></div><div class="lineage-loop mt16"><span>Spawn</span><b>→</b><span>Cohort</span><b>→</b><span>Selection</span><b>→</b><span>Breeding stock</span><b>→</b><span>Pairing check</span><b>→</b><span>Next spawn</span></div></div>`)}<div class="layout"><div class="stack"><div class="card lineage"><div class="lineage-v2-head"><div><div class="eyebrow">${s?esc(s.label):'Proposed pairing'} · lineage derived from recorded events</div><h3 class="mt8">Parentage is captured once, then inherited.</h3></div><div class="fact-strip function pairOptions(aId){const a=stock(aId);return state.stock.filter(s=>pairBuilderEligible(s)&&s.id!==aId&&s.species===a?.species).map(s=>[s.id,`${s.name} · ${s.sex}`]);}
function openPairBuilder(id='atlas'){const st=stock(id);if(st&&st.kind==='Individual')lineagePairA=id;const opts=pairOptions(lineagePairA),preferred=opts.find(([x])=>x!==lineagePairA&&x==='iris')||opts.find(([x])=>x!==lineagePairA);if(!stock(lineagePairB)||stock(lineagePairB)?.species!==stock(lineagePairA)?.species||lineagePairB===lineagePairA)lineagePairB=preferred?.[0]||'';go('pair-builder');}

${esc(a.name)} · known ancestor slots / 3 generations</span></div><div class="coverage"><strong>${cb.known}/${cb.total} · ${cb.pct}%</strong><span>${esc(b?.name||'Stock B')} · known ancestor slots / 3 generations</span></div></div></div></div><div class="spread mt16"><div class="pills">${pill(r.relationship||r.title,r.kind==='warn'?'warn':r.kind==='good'?'good':'info')}</div>${action('relationshipSheet()','View relationship','link-btn')}</div><div class="divider"></div><div class="stack">${r.kind==='warn'?banner('A warning does not block intentional line breeding. The breeder remains in control, but the relationship is explicit before recording the pairing.','warn','warning'):banner('No known common ancestor is not the same as proven unrelated when ancestry is incomplete.','info','info')}${action('toast("Prototype: pairing may continue after the breeder reviews the relationship warning.")','Continue anyway','secondary full')}${action('useOutcrossExample()','Try Atlas × Coda','ghost full')}${action('useSiblingExample()','Try Atlas × Iris','ghost full')}</div></div>${section('How this follows the breeding record',`<div class="card pad"><div class="lineage-loop"><span>Recorded spawn</span><b>→</b><span>Offspring group</span><b>→</b><span>Selected animal</span><b>→</b><span>Recorded parents</span><b>→</b><span>Future pairing check</span></div><p class="sub mt12">Lineage is reconstructed from the same breeding records already used for husbandry.</p></div>`)}${section('Parentage uncertainty stays explicit',`<div class="card">${row('cohort','Sterbai group example','Candidate parent group · individual parents unknown',"go('lineage/p2')")}${row('fish','Guppy brood example','Known mother · sire unknown',"go('lineage/p4')")}</div>`)}</div>`;}
function lineageCohort(c,depth=0){const children=state.cohorts.filter(x=>x.parentId===c.id),merged=c.mergedInto?cohort(c.mergedInto):null;const stateCopy=c.active?`${countText(c)} in group · ${esc(tankName(c.tankId))}`:c.mergedInto?'Historical merge source · excluded from live totals':'Historical split source · excluded from live totals';return `<div><button class="node ${c.active?'highlight':''}" onclick="go('cohort/${c.id}')"><strong>${esc(c.name)}</strong><small>${stateCopy}</small></button>${merged&&depth<5?`<div class="connector"></div><div class="branch">${lineageCohort(merged,depth+1)}</div>`:children.length&&depth<5?`<div class="connector"></div><div class="branch">${children.map(x=>lineageCohort(x,depth+1)).join('')}</div>`:''}${depth>=5&&(children.length||merged)?`<p class="tiny mt8">Further branches are available from the group record.</p>`:''}</div>`;}
function survivalFor(s){const cs=state.cohorts.filter(c=>c.spawnId===s.id),live=cs.filter(c=>c.active).reduce((n,c)=>n+c.count,0),retained=cs.reduce((n,c)=>n+c.retained,0),out=cs.reduce((n,c)=>n+c.outgoing,0),loss=cs.reduce((n,c)=>n+c.losses,0),adjust=cs.reduce((n,c)=>n+c.adjustment,0),estimate=s.hatchPrecision==='estimated'||cs.some(c=>c.precision==='estimated'),numer=live+retained+out;return {live,retained,out,loss,adjust,estimate,numer,rate:s.hatched>0&&cs.length&&adjust===0&&numer<=s.hatched?Math.round(numer/s.hatched*100):null};}
function analyticsScreen(id){const p=project(id);if(!p)return notFound();const s=spawnFor(p),ss=state.spawns.filter(x=>x.pId===id&&x.eggs>0&&x.hatched!==null),stats=s?survivalFor(s):null;return heading('Project analytics',p.name,'',true)+`<div class="layout"><div class="stack">${s?`<div class="card pad"><div class="spread"><h3>${esc(s.label)} · outcomes</h3>${pill('Calculation','info')}</div><div class="metrics two mt16">${metric(stats.rate===null?'—':`${stats.estimate?'≈':''}${stats.rate}%`,'Accounted survival',stats.adjust!==0?'Withheld: unexplained count change':`${stats.numer} alive / live exits ÷ ${s.hatched??'—'} starting fry`)}${metric(stats.loss,'Observed mortality','Across this spawn’s cohort tree')}</div><div class="divider"></div><div class="ledger"><span>Currently in cohorts</span><strong>${stats.estimate?'≈':''}${stats.live}</strong><span>Retained as individual stock</span><strong>${stats.retained}</strong><span>Transferred / sold / gifted alive</span><strong>${stats.out}</strong><span>Observed losses</span><strong>${stats.loss}</strong><span>Unexplained count adjustment</span><strong>${stats.adjust>0?'+':''}${stats.adjust}</strong><span class="total">Original ${p.method==='egg'?'hatch':p.method==='live'?'birth':'observed'} count</span><strong class="total">${s.hatchPrecision==='estimated'?'≈':''}${s.hatched??'Not recorded'}</strong></div><p class="tiny mt12">Survival counts tracked animals plus known live exits at their last recorded disposition. It does not claim survival after leaving the fishroom. Split parents are never double-counted.</p>${stats.adjust!==0?`<div class="mt12">${banner('A lower count is not automatically a death. Resolve the count basis before interpreting survival.','warn','count')}</div>`:''}</div>`:empty('No offspring data yet','A hatch, birth or juvenile observation creates the starting count.')}${p.method==='egg'?`<div class="card pad"><div class="spread"><h3>Hatch / all recorded eggs</h3>${pill(`n = ${ss.length}`,'info')}</div function integrationScreen(){return heading('Connected to Journal','A dedicated workspace. Shared foundations.','',true)+`<div class="layout"><div class="stack"><div class="hero"><div class="eyebrow">Preferred product model</div><h2>One Draneka.<br>Two ways to care.</h2><p>Enable Breeder from Journal, then open directly into your breeding day. Projects and cohorts get their own navigation.</p>${action('workspaceSheet()','Switch workspace','primary','transfer')}</div><div class="card"><div class="row-group-title">Shared, not copied</div>${row('tank','Tanks & water history','The same tank IDs and measured conditions',"go('journal')")}${row('fish','Livestock & media references','Selected breeders become shared livestock',"go('stock')")}${row('feed','Feeding & maintenance','One care event, visible in both contexts',"go('timeline')")}</div>${banner('This is a product model recommendation, not an implementation admission. No account, server, API or database is connected.','info','lock')}</div><div>${section('Who owns what?',`<div class="card pad"><table class="review-table"><thead><tr><th>Concept</th><th>Proposed owner</th></tr></thead><tbody><tr><td>Account, tank identity, species, livestock identity, media identity, movement ledger</td><td>SHARED_CORE</td></tr><tr><td>Water tests, feeding, maintenance, general observations and tank-care history</td><td>JOURNAL_OWNED<br>Reusable by Breeder</td></tr><tr><td>Projects, pairings, spawns, cohorts, splits, selections, ancestry evidence</td><td>BREEDER_OWNED</td></tr><tr><td>Hatch / survival calculations and environmental comparisons</td><td>DERIVED_FROM_SHARED_DATA<br>+ breeder records</td></tr><tr><td>Agenda, Breeder Rounds, contextual Quick Log, cohort views, workspace shell</td><td>PRODUCT_SPECIFIC_PRESENTATION</td></tr></tbody></table></div>`)}${section('Technical identity stays put',`<div class="card pad"><h3>Draneka on the surface.</h3><p class="sub mt8">AquaticFinder remains the internal and backend identity. This prototype introduces no repository, package, database, schema or API rename.</p></div>`)}</div></div>`;}
function settingsScreen(){return heading('Settings','This prototype stays on your device.')+`<div class="narrow stack"><div class="card pad"><h3>Launch workspace</h3><p class="sub mt8">Choose where the demo opens next time.</p><div class="field"><label for="landing">Open Draneka in</label><select id="landing" onchange="state.settings.landing=this.value;persist();toast('Launch workspace saved')"><option value="breeder" ${state.settings.landing==='breeder'?'selected':''}>Aquarium Breeder</option><option value="journal" ${state.settings.landing==='journal'?'selected':''}>Aquarium Journal preview</option></select></div></div><div class="card">${row('download','Export demo data','JSON with all current records and references',"exportAll()")}${row('book','Replay onboarding','No demo records will be removed',"go('onboarding')")}${row('refresh','Reset demo fishroom','Discard local changes and restore sample fixtures',"resetSheet()")}</div><div class="card pad"><h3>Prototype boundaries</h3><div class="status-list"><div class="status-line">${ico('check')}No network or production writes</div><div class="status-line">${ico('check')}Synthetic data, fixed date: 8 Sep 2026</div><div class="status-line">${ico('check')}Metric units in this iteration</div><div class="status-line">${ico('info')}${storageMode==='local'?'Browser-local storage; not a backup':'Session-only storage in this browser context'}</div></div><p class="tiny mt16">Version 0.2 · candidate for independent product/design review. Shared brand assets and visual tokens come from Draneka Journal v0.9.6. Journal and Android implementation authority is unchanged.</p></div>${nav('guide','Review guide & limitations','secondary full','book')}</div>`;}
function onboardingScreen(){return heading('Make room for Breeder','A familiar home for a different kind of care.','',true)+`<div class="narrow"><div class="hero"><div class="eyebrow">Your Journal. Your breeding story.</div><h2>Start with one project.<br>Grow from there.</h2><p>Choose your species, connect your breeding stock and use a tank you already know.</p></div><div class="onboard-cards"><div class="card"><span class="row-icon">${ico('tank')}</span><div><h3>Use your existing tanks</h3><p class="sub mt8">Water tests and care history stay connected.</p></div></div><div class="card"><span class="row-icon">${ico('cohort')}</span><div><h3>Track a cohort, not every fry</h3><p class="sub mt8">Only selected breeders need individual profiles.</p></div></div><div class="card"><span class="row-icon">${ico('lineage')}</span><div><h3>Species-aware, still one product</h3><p class="sub mt8">Templates change guidance and language without creating separate species apps.</p></div></div></div>${banner('Setup uses the demo fishroom’s sample tanks and livestock. No personal account or real Journal data is imported.','info','lock')}${action('newProject()','Create a breeding project','primary full mt20','plus')}${action('begin()','Explore the sample fishroom','ghost full mt8')}</div>`;}
function guideScreen(){return heading('Prototype review guide','v0.6 · species-aware breeder programs candidate.','',true)+`<div class="layout"><div class="stack"><div class="card pad"><h2>Exercise one core across six breeding archetypes</h2><div class="review-guide">${[
'Open Copper halfmoon. Confirm the Program shell is unchanged while the Betta overlay surfaces spawn / free-swimming / parent-removal checkpoints and keeps Ember × Lyra exact parentage evidence-bound.',
'Open Red tuxedo guppy broods. Confirm the overlay describes maternal-line / sex-separation context while the existing record still shows mother known, sire unknown.',
'Open Orange medaka. Confirm repeated egg collections remain separate outputs, then exercise the v0.5 multi-hatch / merge provenance path.',
'Open Rachovii · annual egg-medium line. Confirm the same Program UI now uses egg-medium language and surfaces development / wetting / possible re-dry checkpoints without predicting a hatch.',
'Open Blue dream. Confirm the overlay stays population-first and never invents sire, dam, hatch date or F-generation precision.',
'Open Cockatoo cave brood. Confirm cave / maternal-care / male-separation decision cues appear without turning parent removal into a mandatory rule.',
'Start a new breeding context. Use each species preset and confirm only suggested structure / language changes; no parentage, event or milestone is created by the template.',
'Start a Breeder Round. Confirm species cues appear contextually but the queue still comes only from recorded tasks and active contexts.',
'Run v0.5 regression operations on Betta / Medaka / Neocaridina cohorts: count, move, split, merge, stage change, loss, observation and selected-breeder promotion must preserve source evidence.',
'Check mobile and desktop widths. No species-specific top-level destination should appear anywhere.'
].map(t=>`<div class="guide-row">${t}</div>`).join('')}</div></div><div class="card pad"><h3>Core + overlay rule</h3><p class="sub mt8">Species knowledge may change words, prompts and likely checkpoints around the current Program. It must not create a separate navigation tree, silently schedule biological truth, or fork the lineage/cohort model.</p></div></div><div>${section('Required uncertainty tests',`<div class="card pad"><p class="sub">Guppy sire uncertainty, Medaka breeding-group provenance, annual killifish incubation uncertainty and Neocaridina population provenance must remain explicit. Apistogramma parent-management guidance must stay conditional. Betta exact parents must remain exact only because the controlled pair is recorded.</p></div>`)}${section('Known limits',`<div class="card pad"><p class="sub">Single-user local simulation. No authentication, server syncing, notifications, payments, genetics engine, live AI, sensors or production persistence.</p><p class="sub mt12">The overlay library is deliberately only six validation templates. It is not a complete husbandry library and does not claim that one timing or parent-management pattern applies to every breeder, strain or setup.</p><p class="sub mt12">All fixtures are synthetic. Species cues are research-informed prototype guidance, not veterinary advice or automatically validated husbandry instructions. Chromium qualification does not establish native-device or Safari qualification.</p></div>`)}${nav('integration','Read the Journal relationship','secondary full mt16','book')}</div></div>`;}
function notFound(){return heading('Record unavailable','The requested demo record was not found.','',true)+empty('Return to the fishroom','No record has been changed.',nav('home','Today','primary'),'info');}
function showSheet(title,body,subtitle=''){clearTimeout(toastTimer);$('#toast').innerHTML='';if(!modalOpen)modalFocus=document.activeElement;modalOpen=true;$('#app').inert=true;document.body.style.overflow='hidden';$('#modal').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="handle"></div><div class="sheet-head"><div><h2 id="sheet-title">${esc(title)}</h2>${subtitle?`<p class="sub">${esc(subtitle)}</p>`:''}</div>${action('closeSheet()','<span class="sr-only">Close dialog</span>','icon-btn','close')}</div>${body}</section></div>`;$('.sheet').focus();}
function closeSheet(){if($('#log-form')&&logContext?.pendingStart)pendingStart=null;modalOpen=false;$('#modal').innerHTML='';$('#app').inert=false;document.body.style.overflow='';if(modalFocus?.isConnected)modalFocus.focus({preventScroll:true});}
function evidenceHelpSheet(){showSheet('How Draneka treats records',`<div class="stack">${banner('A reminder or completed check is not automatically a biological fact.','info','check')}<div class="card pad"><div class="fact-key"><div><b>Suggestion</b><span>Guidance that may be worth checking.</span></div><div><b>Scheduled</b><span>A breeder-created plan or reminder.</span></div><div><b>Action</b><span>Something the breeder actually did.</span></div><div><b>Observation</b><span>What the breeder actually saw or measured.</span></div><div><b>Derived state</b><span>A state calculated only from supported records.</span></div></div></div></div>`);}
document.addEventListener('keydown',e=>{if(!modalOpen)return;if(e.key==='Escape'){e.preventDefault();closeSheet();return;}if(e.key==='Tab'){const els=[...$('.sheet').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],summary')].filter(x=>x.offsetParent!==null),first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.sheet'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('.sheet'))){e.preventDefault();first?.focus();}}});
function field(id,label,value='',type='text',attrs='',hint=''){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${attrs}>${hint?`<p class="hint">${esc(hint)}</p>`:''}</div>`;}
function area(id,label,value='',hint=''){return `<div class="field"><label for="${id}">${esc(label)}</label><textarea id="${id}" name="${id}" maxlength="1200">${esc(value)}</textarea>${hint?`<p class="hint">${esc(hint)}</p>`:''}</div>`;}
function select(id,label,options,value,hint=''){return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" name="${id}">${options.map(o=>{const [v,t,disabled]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''} ${disabled?'disabled':''}>${esc(t)}</option>`;}).join('')}</select>${hint?`<p class="hint">${esc(hint)}</p>`:''}</div>`;}
function dateField(id,label,value=TODAY,min='',future=false){return field(id,label,value,'date',`required ${min?`min="${min}"`:''} ${future?'':`max="${TODAY}"`}`);}
function formFooter(label='Save record'){return `<div class="field-error" id="form-error" role="alert"></div><div class="sheet-footer">${action('closeSheet()','Cancel','secondary')}<button type="submit" class="primary">${esc(label)}</button></div>`;}
function formError(text){const el=$('#form-error');if(el){el.textContent=text;el.scrollIntoView({block:'nearest'});}else toast(text);return false;}
const val=id=>$('#'+id)?.value?.trim()||'';
function numberVal(id,min=0,max=1e9,whole=true,optional=false){const v=val(id);if(v===''&&optional)return null;const n=Number(v);if(v===''||!Number.isFinite(n)||n<min||n>max||(whole&&!Number.isInteger(n)))throw new Error(`Enter ${whole?'a whole number':'a number'} between ${min} and ${max}${id==='amount'?' for the quantity':''}.`);return n;}
function validDate(id,min='',future=false){const d=val(id);if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||Number.isNaN(Date.parse(d))||(!future&&d>TODAY)||(min&&d<min))throw new Error(`Choose a valid date${min?' on or after '+fmt(min):''}${future?'':' no later than 7 September 2026'}.`);return d;}
function transaction(fn,message,after){const before=clone(state);try{fn();closeSheet();persist();if(after)go(after);toast(message+(storageMode==='session'?' · this session only':''));return true;}catch(e){state=before;return formError(e.message||'The record could not be saved. No data was changed.');}}
function addEvent(type,p,c,date,title,note,extra={}){const e={id:uid('evt-'),type,pId:p?.id||null,cohortId:c?.id||null,spawnId:c?.spawnId||p?.currentSpawn||null,tankId:c?.tankId||p?.tankId||null,date,title,note,scope:['feed','water','maintenance','move','select','transfer'].includes(type)?'shared':'breeder',...extra};state.events.push(e);return e;}
function workspaceSheet(){showSheet('Your Draneka workspaces',`<p class="sub mb12">Shared tanks and care history. A purpose-built workspace for each kind of work.</p><div class="stack">${action("closeSheet();go('journal')",`${ico('book')}<span><strong>Aquarium Journal</strong><small>Tanks, daily care and their history</small></span>`,`switch-card ${route==='journal'?'active':''}`)}${action("closeSheet();go('home')",`${ico('cohort')}<span><strong>Aquarium Breeder</strong><small>Projects, offspring and the next generation</small></span>`,`switch-card ${route!=='journal'?'active':''}`)}</div><p class="tiny mt16">Local integration preview · no production account connected</p>`);}
function chooseProjectTool(tool){showSheet(tool==='analytics'?'Project analytics':'Project media',`<div class="card">${state.projects.map(p=>row('projects',p.name,p.species,`go('${tool}/${p.id}')`)).join('')}</div>`);}
function newProject(){wizard={step:1,name:'',species:'Betta splendens',method:'egg',form:'Pair',stockIds:['ember','lyra'],tankId:'tb',line:'',goal:'',generation:'Not recorded',start:TODAY,condition:'',target:''};wizardScreen();}
function relatednessNotes(ids){const out=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=stock(ids[i]),b=stock(ids[j]);if(!a||!b)continue;const sa=cohort(a.originCohort)?.spawnId,sb=cohort(b.originCohort)?.spawnId;if(sa&&sa===sb)out.push(`${a.name} and ${b.name} come from the same recorded spawn. Splitting their cohorts does not remove this shared origin.`);else if((sa&&(spawn(sa)?.stockIds||[]).includes(b.id))||(sb&&(spawn(sb)?.stockIds||[]).includes(a.id)))out.push(`${a.name} and ${b.name} have an overlap in recorded parent–offspring provenance.`);}return out;}
function relatednessMarkup(ids){const notes=relatednessNotes(ids);return notes.length?`<div class="mt16">${banner('<strong>Review shared ancestry</strong><br>'+notes.map(esc).join('<br>')+'<br><br>This is a record-based flag, not a genetic test or an inbreeding coefficient. Review the parentage evidence and your breeding objective.','warn','lineage')}</div>`:'';}
function refreshRelatedness(){const box=$('#relatedness-warning');if(box)box.innerHTML=relatednessMarkup([...document.querySelectorAll('input[name=parent]:checked')].map(x=>x.value));}
function stockChoices(species,ids=[]){const choices=state.stock.filter(s=>s.species===species);return choices.length?`<div class="stack mt12">${choices.map(s=>`<label class="checkline"><input name="parent" type="checkbox" onchange="refreshRelatedness()" value="${s.id}" ${ids.includes(s.id)?'checked':''} ${!s.ready?'disabled':''}><span><b>${esc(s.name)}</b> · ${esc(s.sex)}<br><span class="tiny">${esc(s.kind)} · ${s.ready?esc(tankName(s.tankId)):'Candidate: readiness not yet recorded'}</span></span></label>`).join('')}</div><div id="relatedness-warning">${relatednessMarkup(ids)}</div>`:banner('No matching stock records in this demo. You can start with unknown parents and connect stock later.','info','fish');}
function wizardScreen(){const w=wizard;let body='';if(w.step===1)body=field('w-name','Context name (optional)',w.name,'text','maxlength="100" placeholder="Auto-created from species / line if left blank"')+field('w-species','Species',w.species,'text','required list="species-options" maxlength="100"')+`<datalist id="species-options"><option>Betta splendens</option><option>Poecilia reticulata</option><option>Oryzias latipes</option><option>Nothobranchius rachovii</option><option>Neocaridina davidi</option><option>Apistogramma cacatuoides</option><option>Corydoras sterbai</option></datalist>`+speciesPresetStrip(w.species)+wizardOverlayPreview(w.species)+select('w-method','How does reproductive output usually enter this context?',[['egg','Discrete egg event · spawn → hatch'],['collection','Repeated collection / egg-medium batch → hatch'],['live','Livebearer · birth → brood'],['shrimp','Population / colony · observed recruitment']],w.method,'Species templates suggest this structure, but the breeder can choose the neutral record model that matches their evidence.')+`<details class="mt16"><summary>Line, generation and goal</summary><div>${field('w-line','Line / strain (optional)',w.line,'text','maxlength="80"')}${field('w-generation','Generation label (optional)',w.generation,'text','maxlength="50"','Only record a label you can support. Unknown is valid.')}${area('w-goal','What are you working toward? (optional)',w.goal)}</div></details>`;else if(w.step===2)body=select('w-form','Parentage context',[['Pair','Known pair'],['Trio','Candidate trio'],['Group','Breeding group / colony'],['Known mother','Known mother · sire unknown'],['Unknown','Parents / source stock not identified']],w.form)+wizardOverlayPreview(w.species)+`<div class="mt16"><p class="field-label">Connect existing livestock when useful</p><p class="tiny mt8">${esc(w.species)} · leaving parentage unknown is preferable to guessing</p>${stockChoices(w.species,w.stockIds)}</div><div class="mt16">${banner('The species overlay may suggest a common parent unit, but recorded parentage still comes only from the stock/source evidence you select.','info','lineage')}</div>`;else body=select('w-tank','Current location',state.tanks.map(t=>[t.id,`${t.code} · ${t.name} · ${t.litres} L`]),w.tankId)+dateField('w-start','Context start',w.start)+`<details class="mt16"><summary>Conditioning / target notes</summary><div>${area('w-condition','Conditioning notes (optional)',w.condition)+field('w-target','Your target conditions (optional)',w.target,'text','maxlength="160"','A breeder-set plan, not automatic suitability advice.')}</div></details>`+`<div class="card pad mt16"><h3>${esc(w.name||w.line||w.species)}</h3><p class="sub mt8">${esc(w.species)} · ${esc(w.form)} · ${esc(overlayFor(w.species).short)}</p><p class="tiny mt8">${w.stockIds.length?w.stockIds.map(id=>esc(stock(id).name)).join(' + '):'Exact parents not identified'}<br>Tank is current location; ancestry remains with breeding records. Overlay guidance remains suggestion-only.</p></div>`;showSheet('New breeding context',`<div class="step-label"><span>${['Start light','Parentage context','Location'][w.step-1]}</span><b>Step ${w.step} of 3</b></div><div class="steps">${[1,2,3].map(n=>`<i class="${n<=w.step?'on':''}"></i>`).join('')}</div><form onsubmit="event.preventDefault();wizardNext()">${body}<div class="field-error" id="form-error" role="alert"></div><div class="sheet-footer">${w.step>1?action('wizardPrevious()','Back','secondary'):action('closeSheet()','Cancel','secondary')}<button class="primary" type="submit">${w.step===3?'Create context':'Continue'}</button></div></form>`);}
function captureWizard(){const w=wizard;if(w.step===1){w.name=val('w-name');w.species=val('w-species');w.method=val('w-method');w.line=val('w-line');w.generation=val('w-generation')||'Not recorded';w.goal=val('w-goal');}if(w.step===2){w.form=val('w-form');w.stockIds=[...document.querySelectorAll('input[name=parent]:checked')].map(x=>x.value);}if(w.step===3){w.tankId=val('w-tank');w.start=val('w-start');w.condition=val('w-condition');w.target=val('w-target');}}

function validateArrangement(form,ids){const st=ids.map(stock);if(st.some(x=>!x||!x.ready))throw new Error('Select stock with a recorded breeding readiness assessment.');if(form==='Pair'&&(st.length!==2||st.some(s=>s.kind!=='Individual')))throw new Error('A pair needs two individual stock records. Choose Group or Unknown when appropriate.');if(form==='Trio'&&(st.length!==3||st.some(s=>s.kind!=='Individual')))throw new Error('A trio needs three individual stock records. Unknown parents may be used instead.');if(form==='Group'&&st.length===0)throw new Error('Choose a source group or select Unknown.');if(form==='Known mother'&&(st.length!==1||st[0].sex!=='Female'||st[0].kind!=='Individual'))throw new Error('Choose one recorded female or select Unknown.');if(form==='Unknown'&&st.length>0)throw new Error('Uncheck stock records for Unknown, or choose a matching breeding arrangement.');}
