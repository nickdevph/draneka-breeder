speciesOverlaySection=function(p){return section('Species-aware program',overlayGuideMarkup(p,true)+(p.species==='Nothobranchius rachovii'?correctionMopMarkup(p):''));};

function correctionMopCollectionSheet(pId){const p=project(pId);if(!p)return;showSheet('Collect mop / plant egg batch',`<form onsubmit="event.preventDefault();saveCorrectionMopCollection('${p.id}')">${banner('<strong>Mop / plant collection.</strong> This is the same reproductive-output core as the annual egg-medium path. Collection does not infer hatch or success.','info','egg')}${dateField('log-date','Mop / plant collection date',TODAY,p.paired||p.conditionStart||'')}${field('record-label','Mop / plant batch name',`Mop batch ${String(p.spawns.length+1).padStart(2,'0')}`,'text','required maxlength="100"')}${field('amount','Eggs found / estimated','','number','min="0" step="1"','Leave blank only when the observed count is unknown.')}${select('precision','Count basis',[['exact','Exact count'],['estimated','Estimate'],['unknown','Egg count unknown']],'estimated')}${area('log-notes','Collection / holding notes','', 'Record the mop or plant material and observed holding context; do not predict hatch.')}${formFooter('Record mop / plant batch')}</form>`,`Mop / plant workflow · ${p.name}`);}
function saveCorrectionMopCollection(pId){try{const p=project(pId),t=tank(p?.tankId),date=validDate('log-date',p?.paired||p?.conditionStart||''),label=val('record-label'),precision=val('precision'),amount=precision==='unknown'?null:numberVal('amount',0);if(!p||!t)throw new Error('The killifish Program or linked tank is unavailable.');if(!label)throw new Error('Give the mop / plant batch a name.');const note=val('log-notes');return transaction(()=>{const id=uid('spawn-'),env=t.measured.slice(0,10)<=date?{temperature:t.temperature,ph:t.ph,gh:t.gh,days:p.conditionStart?Math.max(0,Math.round((Date.parse(date)-Date.parse(p.conditionStart))/86400000)):0,date:t.measured}:null,ns={id,pId:p.id,label,kind:'collection',date,hatchDate:null,eggs:amount,fertile:null,hatched:null,precision,hatchPrecision:null,removed:0,historical:false,observation:false,expected:null,stockIds:[...p.stockIds],parentage:p.parentage,environment:env,hatches:[],hatchClosed:false,wettingAttempts:[],workflow:'mop-plant',collectionMethod:'spawning mop / plant material'};state.spawns.push(ns);p.spawns.push(id);p.currentSpawn=id;p.stage='Eggs';addEvent('collection',p,null,date,'Mop / plant egg batch recorded',`${amount===null?'Egg count unknown':amount+' eggs found / estimated'} · ${precision}. Spawning mop / plant material recorded. No hatch or success inferred. ${note}`,{spawnId:id,sourceOutputIds:[id],workflow:'mop-plant'});},'Mop / plant egg batch recorded');}catch(e){return formError(e.message);}}

function correctionWettingSheet(type,pId,spawnId){const p=project(pId),s=spawn(spawnId),attempts=correctionAttemptState(s),latest=attempts.at(-1);if(!p||!s||!correctionIsAnnualBatch(s))return toast('Choose the annual egg-medium batch first.');if(type==='wetting'&&latest?.status==='wet')return showSheet('Re-dry the current attempt first',banner('Attempt '+latest.number+' is already wet. Record its re-drying before opening the next wetting attempt. No hatch or success is inferred.','info','refresh'));if(type==='redry'&&latest?.status!=='wet')return showSheet('No wetting attempt to re-dry',banner('Record a wetting attempt before re-drying. The sequence stays explicit and does not infer a hatch.','info','water'));const n=attempts.length+1;const body=type==='wetting'?`${banner(`<strong>Wetting attempt ${n}.</strong> This creates a structured attempt record only. Choose and record an observed state; it does not create a hatch or success.`,`info`,'water')}${dateField('log-date','Wetting date',TODAY,latest?.reDryDate||s.date)}${select('wetting-observation','Observed state at wetting',[['not-recorded','No hatch result recorded'],['development-observed','Embryo development observed'],['no-development-observed','No development observed']],'not-recorded')}${area('log-notes','Wetting notes','', 'Record the breeder observation; a later hatch must be logged separately.')}`:`${banner(`<strong>Re-dry attempt ${latest.number}.</strong> This updates only the current attempt with a re-drying observation. It does not erase the attempt or infer hatch success.`,'info','refresh')}${dateField('log-date','Re-drying date',TODAY,latest.wettingDate||s.date)}${select('redry-observation','Observed re-drying state',[['not-recorded','No further observation recorded'],['medium-re-dried','Medium re-dried as observed'],['medium-condition-recorded','Medium condition recorded']],'not-recorded')}${area('log-notes','Re-drying notes','', 'Keep the re-drying provenance attached to attempt '+latest.number+'.')}`;showSheet(type==='wetting'?`Record wetting attempt ${n}`:`Record re-drying for attempt ${latest.number}`,`<form onsubmit="event.preventDefault();saveCorrectionWetting('${type}','${p.id}','${s.id}')">${body}${formFooter(type==='wetting'?'Record wetting attempt':'Record re-drying')}</form>`,`${p.name} · ${s.label}`);}
function saveCorrectionWetting(type,pId,spawnId){try{const p=project(pId),s=spawn(spawnId);if(!p||!s||!correctionIsAnnualBatch(s))throw new Error('The annual egg-medium batch is unavailable.');const attempts=correctionAttemptState(s),latest=attempts.at(-1),min=type==='redry'?(latest?.wettingDate||s.date):(latest?.reDryDate||s.date),date=validDate('log-date',min),note=val('log-notes');if(type==='wetting'&&latest?.status==='wet')throw new Error('Re-dry the current wetting attempt before recording the next wetting.');if(type==='redry'&&latest?.status!=='wet')throw new Error('Record a wetting attempt before re-drying.');return transaction(()=>{let a,e;if(type==='wetting'){a={id:uid('wet-'),number:attempts.length+1,workflow:'annual-soil',status:'wet',wettingDate:date,wettingObservation:val('wetting-observation'),reDryDate:null,reDryObservation:'',hatchIds:[],eventIds:[]};s.wettingAttempts.push(a);e=addEvent('wetting',p,null,date,`Wetting attempt ${a.number} recorded`,`Annual / soil-spawner egg-medium wetting observation: ${a.wettingObservation}. No hatch or success inferred from wetting. ${note}`,{spawnId:s.id,wettingAttemptId:a.id,wettingAttemptNumber:a.number,wettingPhase:'wetting'});}else{a=latest;a.reDryDate=date;a.reDryObservation=val('redry-observation');a.status='re-dried';e=addEvent('redry',p,null,date,`Re-drying recorded for wetting attempt ${a.number}`,`Annual / soil-spawner egg-medium re-drying observation: ${a.reDryObservation}. Attempt provenance retained; no hatch or success inferred. ${note}`,{spawnId:s.id,wettingAttemptId:a.id,wettingAttemptNumber:a.number,wettingPhase:'re-dry'});}a.eventIds=Array.isArray(a.eventIds)?a.eventIds:[];a.eventIds.push(e.id);},type==='wetting'?'Wetting attempt recorded':'Re-drying recorded');}catch(e){return formError(e.message);}}

function correctionHatchSheet(pId,spawnId){const p=project(pId),s=spawn(spawnId),attempts=correctionAttemptState(s);if(!p||!s)return toast('Choose the annual egg-medium batch first.');if(!attempts.length)return showSheet('Wetting record needed',banner('Record at least one wetting attempt before linking an observed hatch. Wetting timing alone never creates a hatch or success.','info','water')+action(`logSheet('wetting','${p.id}','','','','${s.id}')`,'Record first wetting','primary full mt16','water'),s.label);const remaining=eggRemaining(s),options=attempts.map(a=>[a.id,`Attempt ${a.number} · wetting ${fmt(a.wettingDate)}${a.reDryDate?` · re-dried ${fmt(a.reDryDate)}`:''}`]);showSheet('Record observed annual-killifish hatch',`<form onsubmit="event.preventDefault();saveCorrectionHatch('${p.id}','${s.id}')">${banner(`<strong>${esc(s.label)} · ${s.eggs??'unknown'} original eggs</strong>${s.removed} removed · ${totalHatched(s)} already recorded as hatched. ${remaining===null?'Remaining egg count unknown.':remaining+' recorded eggs remain before this observation.'}`,'','egg')}${select('hatch-attempt','Wetting attempt provenance',options,attempts.at(-1).id,'Select the wetting attempt that preceded this observed hatch. A hatch is not inferred from wetting or timing.')}${dateField('log-date','Hatch observed on',TODAY,s.date)}${field('amount','Fry hatched in this observation','','number','required min="0" step="1"','Enter zero only when explicitly closing the batch with no hatch observed.')}${select('precision','Count basis',[['exact','Exact count'],['estimated','Estimate']],'estimated')}${field('cohort-name','New offspring group name',`${p.line||p.species.split(' ')[0]} fry · ${s.label}`,'text','required maxlength="100"')}${select('hatch-disposition','After this hatch observation',[['keep','Keep this egg batch open for later hatches'],['close','Close this egg batch after this observation']], 'keep','Each observed hatch remains a distinct hatch record linked to its selected wetting attempt.')}${area('log-notes','Hatch observation notes','', 'Observed hatch is recorded separately. No hatch or success is inferred from wetting alone.')}${formFooter('Record observed hatch')}</form>`,`${p.name} · ${s.label}`);}
function saveCorrectionHatch(pId,spawnId){try{const p=project(pId),s=spawn(spawnId),attempts=correctionAttemptState(s),attempt=attempts.find(a=>a.id===val('hatch-attempt'));if(!p||!s||!attempt)throw new Error('Choose a valid wetting attempt provenance record.');const date=validDate('log-date',s.date),amount=numberVal('amount',0),remaining=eggRemaining(s);if(remaining!==null&&amount>remaining)throw new Error('This hatch observation cannot exceed the recorded eggs remaining.');const precision=val('precision'),name=val('cohort-name'),disposition=val('hatch-disposition');if(amount>0&&!name)throw new Error('Name the offspring group.');if(amount===0&&disposition!=='close')throw new Error('A zero hatch can only close the batch explicitly.');const note=val('log-notes');return transaction(()=>{const hatchId=uid('hatch-'),willClose=disposition==='close'||(remaining!==null&&amount>=remaining);let c=null;if(amount){c=createCohort(p,s,name,amount,precision,date,hatchId);c.sourceWettingAttemptIds=[attempt.id];c.wettingAttemptId=attempt.id;}s.hatches=Array.isArray(s.hatches)?s.hatches:[];s.hatches.push({id:hatchId,date,amount,precision,cohortIds:c?[c.id]:[],closedAfter:willClose,wettingAttemptId:attempt.id,wettingAttemptNumber:attempt.number,workflow:'annual-soil'});attempt.hatchIds=Array.isArray(attempt.hatchIds)?attempt.hatchIds:[];attempt.hatchIds.push(hatchId);s.hatchClosed=willClose;syncHatchSummary(s);const e=addEvent('hatch',p,c,date,`${amount} fry hatched · attempt ${attempt.number}`,`${precision==='estimated'?'Estimated':'Exact'} hatch observation linked to wetting attempt ${attempt.number}. No hatch or success was inferred from wetting; this is a separate observed hatch record. ${willClose?'Egg batch closed explicitly.':'Later observed hatch records may remain separate.'} ${note}`,{spawnId:s.id,hatchId,wettingAttemptId:attempt.id,wettingAttemptNumber:attempt.number,sourceOutputIds:[s.id],sourceHatchIds:[hatchId],sourceWettingAttemptIds:[attempt.id]});attempt.eventIds=Array.isArray(attempt.eventIds)?attempt.eventIds:[];attempt.eventIds.push(e.id);p.stage=openEggOutputs(p).length?'Eggs':availableCohorts(p).length?'Fry':'Paired';},'Observed hatch recorded with wetting provenance');}catch(e){return formError(e.message);}}

const correctionOriginalLogSheet=logSheet;
logSheet=function(type,pId,cId='',taskId='',tankOverride='',spawnOverride=''){if(type==='mopcollection')return correctionMopCollectionSheet(pId);if(type==='wetting'||type==='redry'){const p=project(pId),s=spawnOverride?spawn(spawnOverride):correctionAnnualBatch(p);return correctionWettingSheet(type,pId,s?.id||'');}if(type==='hatch'){const p=project(pId),single=p&&openEggOutputs(p).length===1?openEggOutputs(p)[0]:null,s=spawnOverride?spawn(spawnOverride):single;if(correctionIsAnnualBatch(s))return correctionHatchSheet(pId,s.id);}return correctionOriginalLogSheet(type,pId,cId,taskId,tankOverride,spawnOverride);};
const correctionOriginalSaveLog=saveLog;
saveLog=function(){return correctionOriginalSaveLog();};
LOG_NAMES.wetting='Record wetting attempt';LOG_NAMES.redry='Record re-drying';
const correctionP6=state.projects.find(p=>p.species==='Nothobranchius rachovii');if(correctionP6){correctionP6.killifishWorkflow=correctionP6.killifishWorkflow||'annual';const correctionSeedBatch=correctionP6.spawns.map(id=>spawn(id)).find(s=>s?.id==='k01');if(correctionSeedBatch){correctionSeedBatch.workflow=correctionSeedBatch.workflow||'annual-soil';correctionSeedBatch.wettingAttempts=Array.isArray(correctionSeedBatch.wettingAttempts)?correctionSeedBatch.wettingAttempts:[];}}
render();

</script></body></html>
