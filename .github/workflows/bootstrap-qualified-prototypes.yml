name: Bootstrap qualified prototypes

on:
  push:
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble payloads for byte comparison
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / '.import' / 'manifest.json').read_text())
          debug = root / '.debug'
          debug.mkdir(exist_ok=True)
          report = []
          for index, item in enumerate(manifest['artifacts']):
              encoded = ''.join((root / chunk).read_text().strip() for chunk in item['chunks'])
              encoded += '=' * (-len(encoded) % 4)
              payload = base64.b64decode(encoded)
              data = gzip.decompress(payload) if item.get('encoding') == 'gzip+base64' else payload
              digest = hashlib.sha256(data).hexdigest()
              report.append({
                  'index': index,
                  'target': item['path'],
                  'expected_sha256': item['sha256'],
                  'expected_size': item['size'],
                  'observed_sha256': digest,
                  'observed_size': len(data),
              })
              (debug / f'{index:02d}.bin').write_bytes(data)
          (debug / 'report.json').write_text(json.dumps(report, indent=2) + '\n')

      - name: Commit temporary reconstruction evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .debug
          git commit -m "Temporary bootstrap byte-comparison evidence"
          git push
